# Builds the mod and publishes a GitHub Release with the jar attached
# whenever a tag matching "v*" (e.g. v1.0.0) is pushed.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag v$tag_version does not match gradle.properties version $project_version"
            exit 1
          fi
      - name: build
        run: ./gradlew build
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
